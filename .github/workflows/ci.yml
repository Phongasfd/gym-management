name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (types, lint, tests on PostgreSQL, coverage)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: gym_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/gym_test
      SHADOW_DATABASE_URL: postgresql://test:test@localhost:5432/gym_shadow_test
      JWT_SECRET: ci_jwt_secret
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Apply migrations
        run: npx prisma migrate deploy
      - name: Migrations match schema.prisma (no drift)
        run: |
          PGPASSWORD=test psql -h localhost -U test -d gym_test -c "CREATE DATABASE gym_shadow_test"
          npx prisma migrate diff --from-migrations prisma/migrations --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url "$SHADOW_DATABASE_URL" --exit-code
      - name: Unit + integration tests with coverage (fails under the thresholds in jest.config.js)
        run: npm run test:coverage
      - name: Coverage summary
        if: always()
        run: |
          node -e "
            const s = require('./coverage/coverage-summary.json').total;
            const row = (k) => '| ' + k + ' | ' + s[k].pct + '% | ' + s[k].covered + '/' + s[k].total + ' |';
            console.log(['### Backend coverage', '', '| | % | covered |', '|---|---:|---:|', ...['lines','statements','functions','branches'].map(row)].join('\n'));
          " >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage/lcov-report
      - name: Compile
        run: npm run build

  frontends:
    name: Frontend ${{ matrix.app }} (lint, build)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [frontend-admin, frontend-user-next]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json
      - run: npm ci
      - run: npx eslint src
      - run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:3000/api
          VITE_API_BASE_URL: http://localhost:3000/api

  e2e:
    name: End-to-end (Playwright, real browser + API + PostgreSQL)
    runs-on: ubuntu-latest
    needs: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: gym_e2e_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      E2E_DATABASE_URL: postgresql://test:test@localhost:5432/gym_e2e_test
      CI: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install backend
        working-directory: backend
        run: npm ci && npx prisma generate
      - name: Install member portal
        working-directory: frontend-user-next
        run: npm ci
      - name: Install Playwright
        working-directory: e2e
        run: npm ci && npx playwright install --with-deps chromium
      - name: Run e2e tests
        working-directory: e2e
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Backend image (API + worker)
        run: docker build -t gym-backend:ci ./backend
